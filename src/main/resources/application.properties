server.port=${PORT:8081}

# Database Configuration
# Auto-detects PostgreSQL (Render / Supabase / Neon) when SPRING_DATASOURCE_URL is set, otherwise defaults to local H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/auction_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://bidsphere.onrender.com}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktY2hhbmdlLXRoaXMtc2VjcmV0LWJlZm9yZS1kZXBsb3ltZW50LTY0Y2hhcnMtbWluaW11bS1wbGVhc2U=}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:}

# --- PRODUCTION SCALING CONFIG ---
# Redis Distributed Cache & Pub/Sub
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Connection Pooling (HikariCP) for High Concurrency
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000
