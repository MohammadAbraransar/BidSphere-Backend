server.port=${PORT:8081}

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/bidsphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://bidsphere.onrender.com}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktY2hhbmdlLXRoaXMtc2VjcmV0LWJlZm9yZS1kZXBsb3ltZW50LTY0Y2hhcnMtbWluaW11bS1wbGVhc2U=}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:}

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
